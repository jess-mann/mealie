name: Build Test Container

# Personal-fork-only workflow for producing a throwaway Docker image to test
# proposed changes (e.g. an upstream dependency bump) on real devices before
# opening a PR. Pushes to ghcr.io/<your-fork>/mealie under whatever tag you
# pass in.
#
# The official nightly.yml's publish job is gated to mealie-recipes/mealie and
# uses Depot.dev + Docker Hub secrets a fork won't have, so this workflow uses
# docker/build-push-action directly and authenticates to GHCR with the
# runner's GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (also written to __init__.py)"
        required: true
        default: "test"

jobs:
  build-package:
    name: Build Package
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ inputs.tag }}

  publish:
    name: Build and push Docker image
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retrieve Python package
        uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          build-args: |
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
